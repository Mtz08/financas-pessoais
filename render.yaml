# Blueprint do Render (plano free). O banco fica no Neon: cole a URL em DATABASE_URL.
services:
  - type: web
    name: financas
    runtime: python
    plan: free
    region: ohio   # mesma região do banco no Neon (AWS us-east-2): menos latência por consulta
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2
    # Versão do Python: arquivo .python-version (3.13), que aceita versão parcial.
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # informe no painel: URL do Neon com ?sslmode=require
      # ALLOWED_HOSTS e CSRF_TRUSTED_ORIGINS: o settings usa RENDER_EXTERNAL_HOSTNAME,
      # que o Render define sozinho. Só preencha se usar um domínio próprio.
      - key: AXES_PROXY_COUNT
        value: "1"
