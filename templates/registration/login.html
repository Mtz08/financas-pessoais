{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block publico %}
<div class="login">
  <div class="login-marca">
    <span class="marca-icone marca-icone-grande">R$</span>
    <h1>Finanças</h1>
    <p class="muted">Entre para acessar suas contas</p>
  </div>
  <form method="post" class="cartao-form" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="aviso aviso-error" role="alert">Usuário ou senha incorretos. Após 5 tentativas o acesso é bloqueado por 1 hora.</div>
    {% endif %}
    <label>Usuário
      <input type="text" name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
    </label>
    <label>Senha
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
