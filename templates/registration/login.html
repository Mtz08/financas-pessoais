{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<article class="login">
  <h1>Finanças</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}
      <p class="erro" role="alert">Usuário ou senha incorretos. Após 5 tentativas o acesso é bloqueado por 1 hora.</p>
    {% endif %}
    <label>Usuário
      <input type="text" name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
    </label>
    <label>Senha
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
</article>
{% endblock %}
