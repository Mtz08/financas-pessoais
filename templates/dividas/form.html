{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="titulo-acoes"><h1>{{ titulo }}</h1></div>
<div class="cartao-form">
  {% include "_form.html" %}
  <datalist id="credores">{% for c in credores %}<option value="{{ c }}">{% endfor %}</datalist>
  {% if divida %}
    <div class="rodape-form">
      {% if divida.paga %}Paga em {{ divida.data_pagamento|date:"d/m/Y" }}. {% endif %}
      <form method="post" action="{% url 'dividas:excluir' divida.pk %}" class="inline" data-confirmar="Excluir “{{ divida }}”?">
        {% csrf_token %}<button type="submit" class="link perigo">Excluir esta dívida</button>
      </form>
    </div>
  {% endif %}
</div>
{% endblock %}
