name: CI

on: [push, pull_request]

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        banco: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financas
          POSTGRES_PASSWORD: senha_ci_ficticia
          POSTGRES_DB: financas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: chave-somente-para-ci
      DEBUG: "False"
      DATABASE_URL: ${{ matrix.banco == 'postgres' && 'postgres://financas:senha_ci_ficticia@localhost:5432/financas' || 'sqlite:///ci.sqlite3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py collectstatic --noinput   # o mesmo passo do build no Render
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
